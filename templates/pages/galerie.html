<!-- Lightbox -->
<div class="lightbox" data-lightbox aria-hidden="true" role="dialog" aria-modal="true" aria-label="Visionneuse d'images">
  <button class="lightbox__close" type="button" data-lightbox-close aria-label="Fermer la visionneuse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img alt="" data-lightbox-img>
  <p class="lightbox__caption" data-lightbox-caption></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const lb = document.querySelector("[data-lightbox]");
  const lbImg = lb.querySelector("[data-lightbox-img]");
  const lbCap = lb.querySelector("[data-lightbox-caption]");
  let lastFocus = null;

  function openLb(src, alt, cap) {
    lastFocus = document.activeElement;
    lbImg.src = src; lbImg.alt = alt || "";
    lbCap.textContent = cap || "";
    lb.classList.add("is-open");
    lb.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    lb.querySelector("button").focus();
  }
  function closeLb() {
    lb.classList.remove("is-open");
    lb.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }

  document.querySelectorAll("[data-galerie] figure").forEach(fig => {
    const activate = () => {
      const img = fig.querySelector("img");
      openLb(img.src, img.alt, fig.querySelector("figcaption")?.textContent || "");
    };
    fig.addEventListener("click", activate);
    fig.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); } });
  });
  lb.querySelector("[data-lightbox-close]").addEventListener("click", closeLb);
  lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && lb.classList.contains("is-open")) closeLb(); });
});
</script>
